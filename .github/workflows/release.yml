name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build
      - name: Build arm64
        run: npx electron-builder --mac --arm64
      - name: Build x64
        run: npx electron-builder --mac --x64
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
      - name: Prepare release artifacts
        run: |
          mkdir release-artifacts
          find . -name "*.zip" -exec cp {} release-artifacts/ \;
          find . -name "*.dmg" -exec sh -c '
            for f; do
              dir=$(dirname "$f")
              archdir=$(basename "$dir")
              arch="${archdir#build-}"
              base="${f%.dmg}"
              cp "$f" "release-artifacts/$(basename "$base")-${arch}.dmg"
            done
          ' sh {} +
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            release-artifacts/*
