name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npx electron-builder --mac --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
      - name: Prepare release artifacts
        run: |
          mkdir release-artifacts
          # ZIP 文件已包含架构名（如 GitOK-1.0.2-arm64-mac.zip），直接收集
          find . -name "*.zip" -exec cp {} release-artifacts/ \;
          # DMG 文件名相同（gitok-1.0.2.dmg），添加架构后缀避免覆盖
          find . -name "*.dmg" -exec sh -c '
            for f; do
              dir=$(dirname "$f")
              archdir=$(basename "$dir")
              arch="${archdir#build-}"
              base="${f%.dmg}"
              cp "$f" "release-artifacts/$(basename "$base")-${arch}.dmg"
            done
          ' sh {} +
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
